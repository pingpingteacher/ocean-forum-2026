<style>
:root{
  --bg:#F5FAF9; --surface:#FFFFFF; --ink:#10262F; --muted:#4F6A72; --line:#D3E3E3;
  --abyss:#0A2A3B; --current:#14758A; --coral:#D9472F; --coral-ink:#FFFFFF; --foam:#E3F1F0;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#07161D; --surface:#0E2530; --ink:#E4F0F0; --muted:#9DB8BE; --line:#1F3B48; --foam:#12313D; --current:#5BC0D3; --coral:#FF7A63; --coral-ink:#1A0A06;}}
:root[data-theme="dark"]{--bg:#07161D; --surface:#0E2530; --ink:#E4F0F0; --muted:#9DB8BE; --line:#1F3B48; --foam:#12313D; --current:#5BC0D3; --coral:#FF7A63; --coral-ink:#1A0A06;}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.8;font-size:17px}
a{color:var(--current)}
:focus-visible{outline:3px solid var(--coral);outline-offset:3px}
.wrap{max-width:960px;margin:0 auto;padding:0 22px}
section{padding:64px 0}
h2{font-family:var(--serif);font-weight:900;font-size:clamp(26px,4vw,34px);margin:0 0 8px;line-height:1.35}
.lede{color:var(--muted);margin:0 0 32px;max-width:36em}

/* hero */
.hero{background:var(--abyss);color:#EAF6F6;position:relative;overflow:hidden;padding:72px 0 120px}
.hero .wrap{position:relative;z-index:2}
.hero small{display:block;font-size:15px;color:#9FCBD3;margin-bottom:18px}
.hero h1{font-family:var(--serif);font-weight:900;font-size:clamp(44px,9vw,88px);line-height:1.12;margin:0 0 20px;letter-spacing:.02em}
.hero p.sub{font-size:clamp(17px,2.4vw,21px);max-width:30em;margin:0 0 30px;color:#CFE6E8}
.cta{display:inline-block;background:var(--coral);color:var(--coral-ink);font-weight:700;text-decoration:none;padding:14px 28px;border-radius:999px;border:0;font-size:17px;font-family:inherit}
.cta.ghost{background:transparent;color:#EAF6F6;border:2px solid #5BC0D3;margin-left:10px}
.waves{position:absolute;left:0;right:0;bottom:-2px;height:110px;z-index:1}
.waves svg{width:200%;height:100%;display:block;animation:drift 28s linear infinite}
@keyframes drift{to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.waves svg{animation:none}}
.wave-fill{fill:var(--bg)}

/* facts */
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0;border:1px solid var(--line);border-radius:14px;background:var(--surface);margin-top:-48px;position:relative;z-index:3;overflow:hidden}
.facts div{padding:18px 22px;border-right:1px solid var(--line)}
.facts div:last-child{border-right:0}
.facts b{display:block;font-size:14px;color:var(--muted);font-weight:500}
.facts span{font-weight:700;font-size:18px}
.count{font-family:var(--serif);font-size:26px;color:var(--coral)}

/* status */
.st{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:2px 10px;border-radius:999px;background:var(--foam);color:var(--ink);white-space:nowrap;vertical-align:middle}
.st::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted)}
.st.ok::before{background:#1E9A62}.st.inv::before{background:#E0A100}.st.tbd::before{background:var(--muted)}

/* timeline */
.tl{list-style:none;margin:0;padding:0;border-left:3px solid var(--current)}
.tl li{padding:0 0 26px 26px;position:relative}
.tl li::before{content:"";position:absolute;left:-9px;top:9px;width:15px;height:15px;border-radius:50%;background:var(--bg);border:3px solid var(--current)}
.tl li.big::before{background:var(--current)}
.tl time{font-family:var(--serif);font-weight:600;font-size:15px;color:var(--current);display:block}
.tl h3{margin:0;font-size:19px;line-height:1.5}
.tl p{margin:4px 0 0;color:var(--muted);font-size:15.5px}
.tl.nobreak li.rest h3{font-weight:500;color:var(--muted);font-size:17px}

/* people */
.people{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.person{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px 22px}
.person h3{margin:6px 0 2px;font-family:var(--serif);font-size:20px}
.person p{margin:0;color:var(--muted);font-size:15px}

/* register */
#register{background:var(--foam)}
.reg{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:26px;display:flex;flex-direction:column}
.card h3{margin:0 0 6px;font-family:var(--serif);font-size:22px}
.card ul{margin:10px 0 22px;padding-left:20px;color:var(--muted);font-size:15.5px;flex:1}
.card .cta{text-align:center}
.cta[aria-disabled="true"]{background:var(--line);color:var(--muted);pointer-events:none}
.note{margin-top:22px;font-size:15px;color:var(--muted)}

/* news + faq */
.news{list-style:none;padding:0;margin:0}
.news li{display:grid;grid-template-columns:110px 1fr;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.news time{color:var(--muted);font-size:15px}
details{border-bottom:1px solid var(--line);padding:14px 0}
summary{cursor:pointer;font-weight:700}
details p{margin:8px 0 0;color:var(--muted)}
footer{background:var(--abyss);color:#B9D5D9;padding:36px 0 44px;font-size:15px}
footer a{color:#8fd6e4}
@media (max-width:560px){.news li{grid-template-columns:1fr;gap:2px}.facts div{border-right:0;border-bottom:1px solid var(--line)}.cta.ghost{margin:12px 0 0}}
</style>
<style>
.lang{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:14px;z-index:20;background:rgba(10,42,59,.85);color:#EAF6F6;border:1.5px solid #5BC0D3;border-radius:999px;padding:6px 16px;font:700 15px var(--sans);cursor:pointer;backdrop-filter:blur(6px)}

  $("langBtn").textContent = s("btn");
  document.querySelectorAll("[data-k]").forEach(el => { el.innerHTML = s(el.dataset.k); });

  const d = Math.ceil((new Date(CONFIG.dateISO + "T09:30:00+08:00") - new Date()) / 864e5);
  const left = d > 0 ? `<span class="count">${d}</span> ${s("days")}` : (d === 0 ? s("today") : s("over"));
  $("facts").innerHTML = [
    [s("date"), s("dateV") + "<br>" + s("timeV")],
    [s("place"), s("venueV") + " " + pill(CONFIG.venueStatus)],
    [s("size"), s("sizeV")], [s("cost"), s("costV")], [s("left"), left]
  ].map(([k,v]) => `<div><b>${k}</b><span>${v}</span></div>`).join("");

  $("timeline").innerHTML = AGENDA.map(a =>
    `<li class="${a.big?'big':''} ${a.rest?'rest':''}"><time>${a.t}</time><h3>${esc(a.h[i])} ${pill(a.s)}</h3><p>${esc(a.p[i])}</p></li>`).join("");
  $("people").innerHTML = PEOPLE.map(p =>
    `<div class="person">${pill(p.s)}<h3>${esc(p.n[i])}</h3><p>${esc(p.r[i])}</p></div>`).join("");

  [["btnSolo",CONFIG.soloUrl,"btnSolo"],["btnGroup",CONFIG.groupUrl,"btnGroup"]].forEach(([id,url,k]) => {
    const el = $(id);
    if (url){ el.href = url; el.target = "_blank"; el.rel = "noopener"; el.removeAttribute("aria-disabled"); el.textContent = s(k); }
    else { el.setAttribute("aria-disabled","true"); el.textContent = s("soon"); }
  });
  $("regNote").textContent = (CONFIG.soloUrl || CONFIG.groupUrl)
    ? (CONFIG.regDeadline[i] ? s("deadline") + CONFIG.regDeadline[i] + (i ? ". " : "。") : "") + s("regOpen")
    : s("regSoon");

  $("newsList").innerHTML = NEWS.slice().sort((a,b)=>b.d.localeCompare(a.d)).map(n =>
    `<li><time>${n.d.replace(/-/g,".")}</time><span>${esc(n.t[i])}</span></li>`).join("");
  $("faqList").innerHTML = FAQ.map(f => `<details><summary>${esc(f.q[i])}</summary><p>${esc(f.a[i])}</p></details>`).join("");
  $("foot").innerHTML = `<p>${esc(s("host"))}<br>${esc(s("partners"))}</p>` +
    (CONFIG.contact ? `<p>${s("contactL")}${esc(CONFIG.contact)}</p>` : "") + `<p>${esc(s("fine"))}</p>`;
}
$("langBtn").addEventListener("click", () => {
  lang = lang === "zh" ? "en" : "zh";
  try { localStorage.setItem("lang", lang); } catch(e){}
  render();
});
render();
</script>
</body>
</html>
